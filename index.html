<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Poderômetro" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Poderômetro Las Collabs</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">

    <!-- TELA 1 · BUSCA -->
    <section id="screen-home" class="screen active" aria-label="Poderômetro">
      <div class="page parchment-page home-page">
        <div class="lc-seal" aria-hidden="true">LC</div>
        <div class="celestial moon" aria-hidden="true">☾</div>
        <div class="celestial star star-a" aria-hidden="true">✦</div>
        <div class="celestial star star-b" aria-hidden="true">✧</div>
        <div class="celestial star star-c" aria-hidden="true">✦</div>

        <div class="home-copy">
          <p class="brand-intro">LAS COLLABS<br><span>APRESENTAM</span></p>
          <div class="ornament-line"><span>✦</span></div>
          <h1>PODERÔMETRO</h1>
          <p class="tagline">MOSTRA A FORÇA DO SEU PODER</p>
          <div class="ornament-line small"><span>✦</span></div>

          <label class="search-box" for="home-search">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="home-search" type="search" inputmode="search" autocomplete="off" placeholder="Digite um nome..." />
          </label>
          <button id="home-search-btn" class="magic-btn">BUSCAR</button>
        </div>

        <div class="mystic-table" aria-hidden="true"></div>
      </div>
    </section>

    <!-- TELA 2 · RESULTADOS -->
    <section id="screen-results" class="screen" aria-label="Resultados da busca">
      <div class="page parchment-page inner-page">
        <button class="home-btn go-home" aria-label="Voltar ao início">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
        </button>
        <div class="lc-seal inner-seal" aria-hidden="true">LC</div>
        <div class="celestial moon inner-moon" aria-hidden="true">☾</div>

        <div class="screen-content results-content">
          <h2 class="screen-title">RESULTADOS DA BUSCA</h2>
          <div class="ornament-line"><span>✦</span></div>

          <label class="search-box results-search-box" for="results-search">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="results-search" type="search" inputmode="search" autocomplete="off" />
            <button id="clear-search" class="clear-btn" aria-label="Limpar busca">×</button>
          </label>

          <div id="results-list" class="results-list"></div>
          <p id="results-count" class="results-count"></p>
        </div>
        <div class="mystic-table muted-table" aria-hidden="true"></div>
      </div>
    </section>

    <!-- TELA 3 · PREPARE-SE -->
    <section id="screen-test" class="screen" aria-label="Teste de poder">
      <div class="page parchment-page inner-page test-page">
        <button class="home-btn go-home" aria-label="Voltar ao início">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
        </button>
        <div class="lc-seal inner-seal" aria-hidden="true">LC</div>
        <div class="celestial moon inner-moon" aria-hidden="true">☾</div>

        <div class="screen-content test-content">
          <p class="eyebrow">PREPARE-SE</p>
          <div class="ornament-line compact"><span>✦</span></div>
          <h2 id="test-name" class="person-name">Nome</h2>

          <div class="portal-art" aria-hidden="true"></div>

          <p class="test-copy">TODO GRANDE PODER<br>REVELA UM NOVO MUNDO.</p>
          <div class="ornament-line compact"><span>✦</span></div>

          <div class="test-actions">
            <button id="power-test-btn" class="magic-btn">TESTE DE PODER</button>
            <button id="potion-test-btn" class="magic-btn compact-label">TESTE DE PODER APÓS A POÇÃO</button>
          </div>
        </div>
        <div class="mystic-table test-table" aria-hidden="true"></div>
      </div>
    </section>

    <!-- TELA 4 · RESULTADO -->
    <section id="screen-result" class="screen" aria-label="Resultado do poder">
      <div class="page parchment-page inner-page result-page">
        <button class="home-btn go-home" aria-label="Voltar ao início">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
        </button>
        <div class="lc-seal inner-seal" aria-hidden="true">LC</div>
        <div class="celestial moon inner-moon" aria-hidden="true">☾</div>

        <div class="screen-content result-content">
          <p id="result-eyebrow" class="eyebrow">SEU PODER É ÚNICO</p>
          <div class="ornament-line compact"><span>✦</span></div>
          <h2 id="final-name" class="person-name result-name">Nome</h2>

          <div id="power-orb" class="power-orb low" aria-label="Resultado do poder">
            <span class="orb-star os1">✦</span>
            <span class="orb-star os2">✧</span>
            <span class="orb-star os3">✦</span>
            <span class="orb-moon">☾</span>
            <span id="power-value">0%</span>
          </div>

          <div class="quote-card">“GRANDES PODERES<br>CONSTROEM<br>MUNDOS MAIS INCRÍVEIS.”</div>

          <div class="result-actions">
            <button id="restart-btn" class="magic-btn icon-label"><span class="mini-search" aria-hidden="true"></span>NOVA BUSCA</button>
            <button id="result-potion-btn" class="magic-btn compact-label">TESTE DE PODER APÓS A POÇÃO</button>
          </div>
        </div>
        <div class="mystic-table result-table" aria-hidden="true"></div>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
